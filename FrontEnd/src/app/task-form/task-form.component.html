<div class="task-form">
  <h2>{{ task ? 'Edit Task' : 'Add Task' }}</h2>
  <form (ngSubmit)="saveTask()">
    <div>
      <label for="title">Title:</label>
      <input id="title" [(ngModel)]="title" name="title" required />
    </div>
    <div>
      <label for="description">Description:</label>
      <textarea id="description" [(ngModel)]="description" name="description"></textarea>
    </div>
    <div>
      <label>
        <input type="checkbox" [(ngModel)]="completed" name="completed" />
        Completed
      </label>
    </div>
    <button type="submit">{{ task ? 'Update' : 'Add' }} Task</button>
  </form>
</div>
